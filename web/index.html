<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Atlas, your self-hosted knowledge base." />
    <title>Atlas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151b19'/%3E%3Cpath d='M16 5 24 26 16 21 8 26Z' fill='%23e8804a'/%3E%3C/svg%3E" />
    <script>
      // Before first paint, so a dark-mode user never sees a white flash.
      try {
        var saved = localStorage.getItem('atlas.theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      html { background: #f6f3ec; }
      html[data-theme='dark'] { background: #0f1413; }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        color: #1d1b16; background: #f6f3ec; transition: opacity .35s ease, visibility .35s;
      }
      html[data-theme='dark'] #splash { color: #ece8dd; background: #0f1413; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash svg { width: 72px; height: 72px; overflow: visible; }
      #splash .ring { fill: none; stroke: currentColor; stroke-width: 1; opacity: .28; transform-origin: 40px 40px; animation: ring 2.6s ease-out infinite; }
      #splash .ring.b { animation-delay: .85s; }
      #splash .ring.c { animation-delay: 1.7s; }
      #splash .needle { fill: #d9622b; transform-origin: 40px 40px; animation: settle 1.5s cubic-bezier(.3, 1.5, .5, 1) both; }
      @keyframes ring { from { transform: scale(.45); opacity: 0; } 30% { opacity: .34; } to { transform: scale(1.3); opacity: 0; } }
      @keyframes settle { from { transform: rotate(-120deg); } to { transform: rotate(0); } }
      @media (prefers-reduced-motion: reduce) { #splash .ring, #splash .needle { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Atlas">
      <svg viewBox="0 0 80 80" aria-hidden="true">
        <circle class="ring" cx="40" cy="40" r="30" />
        <circle class="ring b" cx="40" cy="40" r="30" />
        <circle class="ring c" cx="40" cy="40" r="30" />
        <path class="needle" d="M40 16 53 60 40 52 27 60Z" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
